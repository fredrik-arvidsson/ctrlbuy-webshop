spring:
  datasource:
    url: jdbc:mysql://shortline.proxy.rlwy.net:10114/railway
    username: railway_user              # ← HÅRDKODAT - ingen variable
    password: KmfWrJfpXMIRYVKKUBjFvkbjjzjDdSjt  # ← HÅRDKODAT - ingen variable
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: CtrlBuyHikariPool

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: create-drop  # ULTIMAT FIX: Garanterar komplett tabellåterskapning
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: Europe/Stockholm
        hbm2ddl:
          auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
    generate-ddl: true

  sql:
    init:
      mode: never  # Låter Hibernate hantera allt

  thymeleaf:
    cache: false  # För debugging

  web:
    resources:
      cache:
        period: 3600
        use-last-modified: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
        transport:
          protocol: smtp
        debug: false
    test-connection: false
    default-encoding: UTF-8

# =======================================
# SERVER CONFIGURATION
# =======================================
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
  error:
    include-message: always  # För debugging
    include-stacktrace: on_param
    include-exception: true

# =======================================
# LOGGING - MAXIMAL DEBUG
# =======================================
logging:
  level:
    root: INFO
    com.ctrlbuy.webshop: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.mail: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.springframework.transaction: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'

# =======================================
# JWT CONFIGURATION
# =======================================
jwt:
  secret: ${JWT_SECRET:ctrlbuy-secret-key-change-in-production}
  expirationMs: 86400000
  refresh-token:
    expiration: 604800000

