# =======================================
# RAILWAY MILJÖ - PRODUCTION MySQL
# =======================================
# Railway sätter automatiskt MYSQLURL environment variable
# =======================================

spring:
  datasource:
    url: ${MYSQLURL}
    # Railway MySQL connection kommer från MYSQLURL env var

  jpa:
    hibernate:
      ddl-auto: update  # Säker för produktion
    show-sql: false  # Ingen SQL logging i produktion

  # Production cache settings
  thymeleaf:
    cache: true

# =======================================
# PRODUCTION LOGGING
# =======================================
logging:
  level:
    root: WARN
    com.ctrlbuy.webshop: INFO
    org.hibernate.SQL: WARN  # Minimal SQL logging

# =======================================
# RAILWAY ENVIRONMENT
# =======================================
app:
  base:
    url: https://ctrlbuy-webshop-production.up.railway.app

server:
  port: ${PORT:8080}  # Railway sätter PORT automatiskt

# =======================================
# RAILWAY INFO
# =======================================
info:
  app:
    environment: Production (Railway)
    database:
      provider: Railway MySQL
      region: EU West (Amsterdam)