# =======================================
# CTRLBUY WEBSHOP - SPRING BOOT CONFIGURATION
# =======================================
# MySQL överallt - Förenklad version utan property errors
# =======================================

spring:
  profiles:
    active: dev

  # =======================================
  # DATABAS KONFIGURATION (MySQL ENDAST)
  # =======================================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ctrlbuy_webshop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Stockholm}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: CtrlBuyHikariPool

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: create
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: Europe/Stockholm
    show-sql: false

  # =======================================
  # EMAIL CONFIGURATION (SMTP)
  # =======================================
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: ${MAIL_HOST:smtp.gmail.com}
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
        transport:
          protocol: smtp
        debug: ${MAIL_DEBUG:false}
    test-connection: false
    default-encoding: UTF-8

  # =======================================
  # THYMELEAF CONFIGURATION
  # =======================================
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: ${TEMPLATE_CACHE:false}
    encoding: UTF-8
    enabled: true

  # =======================================
  # WEB RESOURCES CACHE
  # =======================================
  web:
    resources:
      cache:
        period: 0
        use-last-modified: false

# =======================================
# SERVER CONFIGURATION
# =======================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
  error:
    include-message: always
    include-stacktrace: always
    include-exception: true

# =======================================
# SECURITY - JWT CONFIGURATION
# =======================================
jwt:
  secret: ${JWT_SECRET:ctrlbuy-secret-key-change-in-production}
  expirationMs: 86400000
  refresh-token:
    expiration: 604800000

# =======================================
# CUSTOM APPLICATION PROPERTIES
# Dessa läses av våra @ConfigurationProperties classes
# =======================================
app:
  email:
    enabled: ${EMAIL_ENABLED:true}
    from: ${MAIL_FROM:noreply@ctrlbuy.se}
    from-name: ${MAIL_FROM_NAME:CTRL+BUY Solutions}
    company:
      name: ${COMPANY_NAME:CtrlBuy}
      support-email: ${SUPPORT_EMAIL:support@ctrlbuy.se}
      phone: ${COMPANY_PHONE:+46 8 123 456 78}
    vat:
      rate: 0.25
      country: SE
      currency: kr

  order:
    confirmation:
      send-email: ${ORDER_EMAIL_ENABLED:true}
      admin-notification: ${ADMIN_NOTIFICATION_ENABLED:true}
      admin-email: ${ADMIN_EMAIL:admin@ctrlbuy.se}

  base:
    url: ${APP_BASE_URL:http://localhost:8080}

# =======================================
# LOGGING CONFIGURATION
# =======================================
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.ctrlbuy.webshop: ${APP_LOG_LEVEL:DEBUG}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}
    org.springframework.web: ${WEB_LOG_LEVEL:INFO}
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    # EMAIL DEBUG
    org.springframework.mail: DEBUG
    com.ctrlbuy.webshop.service.EmailService: DEBUG
    javax.mail: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'

# =======================================
# ACTUATOR (MONITORING)
# =======================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    defaults:
      enabled: true
  info:
    env:
      enabled: true

# =======================================
# APPLICATION INFO
# =======================================
info:
  app:
    name: CtrlBuy Webshop
    description: Enterprise E-commerce Platform with MySQL & EmailService
    version: 1.0.0
    security: Spring Security with JWT
    database: MySQL 8.0

---
# =======================================
# DEV PROFILE - LOKAL UTVECKLING
# =======================================
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ctrlbuy_webshop}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  # MAILHOG FÖR DEV (eller Gmail)
  mail:
    host: ${DEV_MAIL_HOST:localhost}
    port: ${DEV_MAIL_PORT:1025}
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
          ssl:
            enable: false
        transport:
          protocol: smtp
        debug: true
    test-connection: false
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
  thymeleaf:
    cache: false

app:
  email:
    enabled: true
    from: ${MAIL_FROM:test@ctrlbuy.se}
    from-name: CTRL+BUY Solutions (DEV)
    company:
      name: CtrlBuy DEV
      support-email: dev-support@ctrlbuy.se
      phone: "+46 8 123 456 78 (DEV)"

logging:
  level:
    com.ctrlbuy.webshop.service.EmailService: TRACE
    org.springframework.mail: TRACE

---
# =======================================
# AWS PROFILE - PRODUKTION
# =======================================
spring:
  config:
    activate:
      on-profile: aws
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
        debug: false
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  thymeleaf:
    cache: true

logging:
  level:
    com.ctrlbuy.webshop.service.EmailService: INFO
    org.springframework.mail: WARN

