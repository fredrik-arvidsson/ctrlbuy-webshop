# =======================================
# DEVELOPMENT MILJÖ - LOKAL DOCKER MySQL
# =======================================
# Kör: docker-compose up -d
# Sedan: source .env && mvn spring-boot:run
# =======================================

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/webshop_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Stockholm
    username: webshop_user
    password: ${DEV_DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update  # Update schema istället för create-drop för att behålla data
    show-sql: true  # Visa SQL i development

  # Development-specifika inställningar
  thymeleaf:
    cache: false  # Ingen cache i development

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  # MAILHOG KONFIGURATION FÖR DEV
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
          ssl:
            enable: false
        transport:
          protocol: smtp
        debug: true
    test-connection: false
    default-encoding: UTF-8

# =======================================
# DEVELOPMENT LOGGING
# =======================================
logging:
  level:
    root: INFO
    com.ctrlbuy.webshop: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    # ADMIN CONTROLLER DEBUG
    com.ctrlbuy.webshop.controller.AdminController: DEBUG
    # EMAIL DEBUG
    org.springframework.mail: DEBUG
    com.ctrlbuy.webshop.service.EmailService: DEBUG

# =======================================
# DEVELOPMENT APP SETTINGS
# =======================================
app:
  base:
    url: http://localhost:8080
  email:
    enabled: true
    from: test@ctrlbuy.se
    from-name: CTRL+BUY Solutions (DEV)
    company:
      name: CtrlBuy DEV

# =======================================
# DEVELOPMENT INFO
# =======================================
info:
  app:
    environment: Development (Local Docker MySQL)
    database:
      host: localhost
      port: 3306
      name: ctrlbuy_webshop