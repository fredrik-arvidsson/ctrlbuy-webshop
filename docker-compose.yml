version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: webshop-mysql
    environment:
      MYSQL_DATABASE: webshop_db
      MYSQL_USER: webshop_user
      MYSQL_PASSWORD: webshop_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"  # ÄNDRAD PORT - undviker konflikt med lokal MySQL
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - webshop-network
    # VIKTIGT: HEALTHCHECK SÅ VI VET NÄR MYSQL ÄR REDO
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s

  webshop-app:
    build: .
    container_name: webshop-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/webshop_db
      - SPRING_DATASOURCE_USERNAME=webshop_user
      - SPRING_DATASOURCE_PASSWORD=webshop_password
      - SPRING_MAIL_HOST=mailhog
      - SPRING_MAIL_PORT=1025
      - SPRING_PROFILES_ACTIVE=dev
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD:-SuperAdmin2024!}
    networks:
      - webshop-network
    # VIKTIGT: VÄNTA PÅ MYSQL
    depends_on:
      mysql:
        condition: service_healthy
    # EXTRA SÄKERHET: STARTA OM VID KRASCH
    restart: on-failure

  mailhog:
    image: mailhog/mailhog:latest
    container_name: webshop-mailhog
    ports:
      - "1025:1025"  # SMTP port för Spring Boot
      - "8025:8025"  # Web UI för email-viewing
    networks:
      - webshop-network

volumes:
  mysql_data:

networks:
  webshop-network:
    driver: bridge