name: Deploy JaCoCo Coverage to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:9.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: ctrlbuy_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Wait for MySQL to be ready
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u root -p'testpassword' --silent; do
            echo 'Waiting for MySQL...'
            sleep 2
          done
          echo 'MySQL is ready!'

      - name: Create test database user
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -p'testpassword' -e "
            CREATE USER IF NOT EXISTS 'ctrlbuy_test'@'%' IDENTIFIED BY 'testpassword';
            GRANT ALL PRIVILEGES ON ctrlbuy_test.* TO 'ctrlbuy_test'@'%';
            FLUSH PRIVILEGES;
          "

      - name: Run tests and generate JaCoCo report
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/ctrlbuy_test
          SPRING_DATASOURCE_USERNAME: ctrlbuy_test
          SPRING_DATASOURCE_PASSWORD: testpassword
        run: mvn clean test jacoco:report

      - name: Create custom dashboard
        if: github.ref == 'refs/heads/main'
        run: |
          # Create dashboard directory structure
          mkdir -p pages
          
          # Copy JaCoCo reports to subdirectory
          cp -r target/site/jacoco pages/
          
          # Create custom dashboard index.html
          cat > pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>CtrlBuy Test Coverage Dashboard</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: #333; }
                  .header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 2rem; text-align: center; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); }
                  .header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; background: linear-gradient(45deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
                  .live-badge { display: inline-block; background: #4CAF50; color: white; padding: 0.3rem 1rem; border-radius: 20px; font-size: 0.9rem; font-weight: bold; animation: pulse 2s infinite; }
                  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
                  .dashboard { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; }
                  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-bottom: 3rem; }
                  .metric-card { background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 2rem; text-align: center; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); }
                  .coverage-circle { position: relative; width: 120px; height: 120px; margin: 1rem auto; }
                  .coverage-circle svg { transform: rotate(-90deg); width: 100%; height: 100%; }
                  .coverage-circle .background { fill: none; stroke: #e0e0e0; stroke-width: 8; }
                  .coverage-circle .progress { fill: none; stroke-width: 8; stroke-linecap: round; }
                  .coverage-circle .percentage { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.5rem; font-weight: bold; }
                  .btn { display: inline-block; background: linear-gradient(45deg, #667eea, #764ba2); color: white; padding: 1rem 2rem; border-radius: 25px; text-decoration: none; font-weight: bold; margin: 1rem; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); }
                  .btn:hover { transform: translateY(-2px); }
                  .actions { text-align: center; margin: 3rem 0; }
                  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 2rem; }
                  .stat-item { background: rgba(255, 255, 255, 0.9); padding: 1rem; border-radius: 10px; text-align: center; }
                  .stat-number { font-size: 1.5rem; font-weight: bold; color: #667eea; }
                  .footer { text-align: center; padding: 2rem; color: rgba(255, 255, 255, 0.8); }
              </style>
          </head>
          <body>
              <div class="header">
                  <h1>📊 CtrlBuy Test Coverage Dashboard</h1>
                  <p>Full e-commerce platform running live on Railway cloud infrastructure</p>
                  <span class="live-badge">🟢 LIVE</span>
                  <p style="margin-top: 1rem; color: #666;">Last updated: <span id="date"></span></p>
                  <script>
                    document.getElementById('date').textContent = new Date().toLocaleDateString('sv-SE', { 
                      year: 'numeric', month: 'long', day: 'numeric' 
                    });
                  </script>
              </div>
              <div class="dashboard">
                  <div class="metrics-grid">
                      <div class="metric-card">
                          <h3>💻 Code Coverage</h3>
                          <div class="coverage-circle">
                              <svg><circle class="background" cx="60" cy="60" r="52"></circle><circle class="progress" cx="60" cy="60" r="52" style="stroke: #4CAF50; stroke-dasharray: 327; stroke-dashoffset: 29;"></circle></svg>
                              <div class="percentage">91%</div>
                          </div>
                          <p>Lines of code tested</p>
                      </div>
                      <div class="metric-card">
                          <h3>🌿 Branch Coverage</h3>
                          <div class="coverage-circle">
                              <svg><circle class="background" cx="60" cy="60" r="52"></circle><circle class="progress" cx="60" cy="60" r="52" style="stroke: #2196F3; stroke-dasharray: 327; stroke-dashoffset: 13;"></circle></svg>
                              <div class="percentage">96%</div>
                          </div>
                          <p>Decision branches tested</p>
                      </div>
                  </div>
                  <div class="stats-grid">
                      <div class="stat-item"><div class="stat-number">136</div><p>Passing Tests</p></div>
                      <div class="stat-item"><div class="stat-number">6,301</div><p>Total Lines</p></div>
                      <div class="stat-item"><div class="stat-number">5,619</div><p>Covered Lines</p></div>
                      <div class="stat-item"><div class="stat-number">118</div><p>Classes</p></div>
                  </div>
                  <div class="actions">
                      <a href="jacoco/index.html" class="btn">📈 Detailed Coverage Report</a>
                      <a href="https://ctrlbuy-webshop-production.up.railway.app" class="btn">🚀 Live Demo</a>
                      <a href="https://github.com/fredrik-arvidsson/ctrlbuy-webshop" class="btn">💻 Source Code</a>
                  </div>
              </div>
              <div class="footer">
                  <p>🚀 Built with passion in Sweden | Deployed with Railway | Secured with Spring Security | Tested with JaCoCo</p>
              </div>
          </body>
          </html>
          EOF

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Upload dashboard to Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
