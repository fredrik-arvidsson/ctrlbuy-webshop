name: CtrlBuy CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write
  checks: write
  pages: write
  id-token: write

jobs:
  quick-test:
    runs-on: ubuntu-latest
    name: Quick Test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run quick tests with H2
        run: ./mvnw test -Dtest=BasicTest -Dspring.profiles.active=test

  live-demo:
    runs-on: ubuntu-latest
    name: Live Demo
    needs: quick-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build application
        run: ./mvnw clean compile -Dspring.profiles.active=test

      - name: Start application with H2
        run: |
          ./mvnw spring-boot:run -Dspring.profiles.active=test > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application startup
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8080/actuator/health 2>/dev/null; do sleep 2; done'

      - name: Test application endpoints
        run: |
          echo "✅ Testing main page..."
          curl -f http://localhost:8080/ || echo "❌ Main page test failed"
          
          echo "✅ Testing products page..."
          curl -f http://localhost:8080/produkter || echo "❌ Products page test failed"
          
          echo "✅ Testing health endpoint..."
          curl -f http://localhost:8080/actuator/health || echo "❌ Health check failed"
          
          echo "🎉 Live demo test completed!"

      - name: Show application logs
        if: failure()
        run: |
          echo "=== APPLICATION LOGS ==="
          cat app.log

      - name: Stop application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi

  test-and-coverage:
    runs-on: ubuntu-latest
    needs: [quick-test, live-demo]

    # Lägg till environment för Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Kör tester med coverage (H2)
        run: ./mvnw clean test jacoco:report -Dspring.profiles.active=test

      - name: Generera test rapport
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: JUnit Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Generera JaCoCo badges
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          badges-directory: .github/badges
          generate-branches-badge: true
          generate-summary: true

      - name: Ladda upp test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/site/jacoco/
            .github/badges/
          retention-days: 30

      # Ny modern GitHub Pages deployment
      - name: Förbered Pages innehåll
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p *site/coverage
          cp -r target/site/jacoco/* *site/coverage/
          
          # Skapa en huvudsida som länkar till coverage
          cat > *site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>CtrlBuy Webshop - Test Reports</title>
              <meta charset="utf-8">
              <style>
                  body { font-family: Arial, sans-serif; margin: 40px; }
                  .container { max-width: 800px; margin: 0 auto; }
                  .badge { margin: 10px 0; }
                  .link { display: inline-block; margin: 10px 0; padding: 10px 20px; background: #0066cc; color: white; text-decoration: none; border-radius: 5px; }
                  .link:hover { background: #0052a3; }
                  .status { background: #28a745; color: white; padding: 5px 10px; border-radius: 3px; margin: 5px 0; display: inline-block; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🛒 CtrlBuy Webshop - Test Reports</h1>
          
                  <div class="status">✅ Quick Test: PASSED</div>
                  <div class="status">✅ Live Demo: PASSED</div>
                  <div class="status">✅ Full Test Suite: PASSED</div>
          
                  <h2>📊 Code Coverage</h2>
                  <div class="badge">
                      <img src="https://img.shields.io/badge/Coverage-Loading...-yellow" alt="Coverage Badge" id="coverage-badge">
                  </div>
          
                  <a href="coverage/" class="link">📈 View Detailed Coverage Report</a>
          
                  <h2>🔗 Useful Links</h2>
                  <ul>
                      <li><a href="https://github.com/fredrik-arvidsson/ctrlbuy-webshop">📁 GitHub Repository</a></li>
                      <li><a href="https://github.com/fredrik-arvidsson/ctrlbuy-webshop/actions">⚙️ GitHub Actions</a></li>
                  </ul>
          
                  <hr>
                  <p><small>Last updated: $(date)</small></p>
              </div>
          </body>
          </html>
          EOF

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '*site'

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4