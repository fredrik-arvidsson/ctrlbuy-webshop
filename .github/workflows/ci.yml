name: CtrlBuy CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Quick Test

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Build application
        run: mvn clean compile -DskipTests

      - name: Run tests
        run: mvn test

  live-demo:
    runs-on: ubuntu-latest
    name: Live Demo
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Build application
        run: mvn clean package -DskipTests

      - name: Start application with H2
        run: |
          nohup java -jar target/*.jar --spring.profiles.active=default --spring.datasource.url=jdbc:h2:mem:testdb --spring.h2.console.enabled=true > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application startup (extra long timeout)
        run: |
          echo "Waiting for application to start up (maximum 4 minutes)..."
          for i in {1..48}; do
            if curl -f http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "Application is ready!"
              curl -s http://localhost:8080/actuator/health | jq '.' || echo "Health endpoint responded but not JSON"
              exit 0
            fi
            echo "Attempt $i/48: Application not ready yet, waiting 5 seconds..."
            sleep 5
          done
          echo "Application failed to start within 4 minutes"
          echo "=== Application logs ==="
          cat app.log || echo "No app.log found"
          echo "=== End of logs ==="
          exit 1

      - name: Test application endpoints
        run: |
          echo "Testing main endpoints..."
          curl -f http://localhost:8080/ || echo "Main page failed"
          curl -f http://localhost:8080/actuator/health || echo "Health check failed"
          curl -f http://localhost:8080/actuator/info || echo "Info endpoint failed"

      - name: Show application logs
        if: always()
        run: |
          echo "=== Application Logs ==="
          cat app.log || echo "No log file found"

      - name: Stop application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || echo "Process already stopped"
          fi

  coverage:
    runs-on: ubuntu-latest
    name: Coverage Report
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Generate coverage report
        run: mvn clean test jacoco:report

      - name: Upload coverage to Codecov
        if: success()
        run: echo "Coverage report generated successfully"